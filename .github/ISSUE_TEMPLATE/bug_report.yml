name: 缺陷报告 / Bug report
about: 报告安装、部署或运行中的问题 / Report an installation or runtime problem
title: "[Bug] "
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量填全下面每一项 —— Netglimmer 的部署差异很大
        （在线/离线、源码/二进制交付、发行版版本），环境信息往往直接决定结论。

        **涉及安全漏洞请勿在此提交**，改走 [SECURITY.md](https://github.com/netglimmer/netglimmer-vpn-manage/blob/main/SECURITY.md) 的私密报告通道。
  - type: textarea
    id: what-happened
    attributes:
      label: 问题现象 / What happened
      description: 实际发生了什么，以及你期望的行为
      placeholder: |
        现象：安装脚本在「步骤 6/10 系统网络策略」报错退出
        期望：顺利完成安装并输出面板地址
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 面板版本 / Panel version
      description: 面板页脚或 `ocserv-manager` 所属 Release，例如 v1.8
    validations:
      required: true
  - type: dropdown
    id: delivery
    attributes:
      label: 交付模式 / Delivery mode
      options:
        - 二进制交付（发布包内含 ocserv-manager）
        - 源码模式（目录内含 backend/ 与 frontend/）
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: install-mode
    attributes:
      label: 安装模式 / Install mode
      options:
        - 在线
        - 完全离线（--offline）
        - 不确定
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统与架构 / OS and arch
      description: 贴 `cat /etc/os-release | head -3 && uname -m` 的输出
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / Relevant logs
      description: |
        请贴出关键日志片段（**提交前把密码、令牌、机器码、公网 IP 打码**）：
        ```
        journalctl -u ocserv -n 200 --no-pager
        journalctl -u ocserv-manager -n 200 --no-pager
        systemctl status nginx dnsmasq
        ```
      render: text
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. 执行 `sudo ./ocserv-manager install --offline`
        2. 选择语言 中文
        3. 服务器地址直接回车采用探测值
        4. ……
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 已确认 / Confirmations
      options:
        - label: 我已把日志与截图中的凭据、令牌、机器码打码
          required: true
        - label: 我已在 Issue 列表中搜索，确认不是重复问题
          required: true
        - label: 我已核对 README 的「常见问题」与端口说明（面板 8443 / VPN 443）
          required: true
