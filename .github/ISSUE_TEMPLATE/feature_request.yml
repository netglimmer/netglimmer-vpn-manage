name: 功能建议 / Feature request
about: 提出新功能或改进现有能力 / Suggest an idea for this project
title: "[Feature] "
labels: enhancement
body:
  - type: markdown
    attributes:
      value: |
        说明这个功能想解决的**实际运维问题**，比"加个按钮"更有助于排期。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / The problem
      description: 现在遇到什么不便？在什么场景下发生？
      placeholder: |
        我们有多套 VPN 环境，每次都要逐个登录面板核对当日在线人数与流量，
        没有一个汇总视图……
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的做法 / Proposed solution
      description: 你希望它长什么样（界面位置、交互、输出）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 临时替代方案 / Workarounds tried
      description: 目前你如何绕过这个问题（有替代方案说明优先级，没有说明缺口）
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块 / Affected area
      options:
        - 用户与用户组
        - 网络与策略（接口 / 路由 / NAT / 访问控制）
        - 资源与域名智能放行
        - 证书与安全（CA / 客户端证书 / CRL / 封禁）
        - 可观测与态势感知
        - 备份与恢复
        - 通知与日报
        - 安装与交付
        - 授权与许可
        - 其它
  - type: textarea
    id: context
    attributes:
      label: 部署背景 / Deployment context
      description: 规模（并发在线数）、是否离线环境、面板版本 —— 这些会直接影响方案取舍
